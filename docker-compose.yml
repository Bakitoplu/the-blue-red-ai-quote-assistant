services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tbr
      POSTGRES_USER: tbr
      POSTGRES_PASSWORD: tbr
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tbr -d tbr"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://tbr:tbr@postgres:5432/tbr
      DATASET_DIR: /dataset
      AUTO_SEED: "true"
      LLM_ENABLED: "false"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_API_URL: http://127.0.0.1:8000
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
